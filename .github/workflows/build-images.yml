name: Build images

# Reusable immutable-artifact build (ADR-028). Called by CI on pull requests to
# prove the images still build, and by the staging deployment on `develop` to
# produce the artifacts that are actually deployed.
#
# Build once, promote many: this is the ONLY place images are built. Staging
# deploys what it outputs; a future production promotion deploys the same
# digests. No environment ever rebuilds from source.
#
# Deliberately ONE job rather than a matrix. A matrix job can only contribute
# to the workflow's outputs through its own `outputs` map, and every parallel
# leg evaluates every key — so the three legs that did not produce a given
# digest would overwrite the one that did with an empty string. Sequential also
# lets the three backend images share the builder layers.
on:
  workflow_call:
    inputs:
      push:
        description: Push to GHCR and emit digests. False builds only (pull requests).
        type: boolean
        default: false
    outputs:
      api-digest:
        value: ${{ jobs.build.outputs.api-digest }}
      ingestion-digest:
        value: ${{ jobs.build.outputs.ingestion-digest }}
      migrator-digest:
        value: ${{ jobs.build.outputs.migrator-digest }}
      web-digest:
        value: ${{ jobs.build.outputs.web-digest }}

# No `permissions:` here, at either level. A called workflow cannot request
# more than its caller grants — a job-level block asking for `packages: write`
# fails the whole run at startup when invoked from the pull-request call site,
# which grants only `contents: read`. Each call site in deploy-staging.yml
# declares exactly what that path needs.

# Action versions are the current majors: buildx v4, login v4, build-push v7,
# attest-build-provenance v4. trivy-action publishes only `v`-prefixed tags and
# has no floating major, so it is pinned exactly — an unresolvable action fails
# the whole job at set-up time, before any `if:` on the step is evaluated.
jobs:
  build:
    name: Build ${{ inputs.push && 'and push' || '(no push)' }} OCI images
    runs-on: ubuntu-latest
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      ingestion-digest: ${{ steps.ingestion.outputs.digest }}
      migrator-digest: ${{ steps.migrator.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are convenience aliases only; the digest is the deployment
      # identity, and `latest` is deliberately never published (ADR-028 §2).
      #
      # The branch tag is emitted only when pushing: on a pull_request,
      # `github.ref_name` is `<pr-number>/merge`, which is not a valid OCI
      # reference at all — tagging with it fails the build outright.
      - name: Build api
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          build-args: |
            MODULE=api
            GIT_SHA=${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/testinbox-api:${{ github.sha }}
            ${{ inputs.push && format('{0}/testinbox-api:{1}', env.REGISTRY, github.ref_name) || '' }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,scope=backend-api,mode=max

      - name: Build ingestion
        id: ingestion
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          build-args: |
            MODULE=ingestion
            GIT_SHA=${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/testinbox-ingestion:${{ github.sha }}
            ${{ inputs.push && format('{0}/testinbox-ingestion:{1}', env.REGISTRY, github.ref_name) || '' }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=backend-ingestion
          cache-to: type=gha,scope=backend-ingestion,mode=max

      - name: Build migrator
        id: migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          build-args: |
            MODULE=migrator
            GIT_SHA=${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/testinbox-migrator:${{ github.sha }}
            ${{ inputs.push && format('{0}/testinbox-migrator:{1}', env.REGISTRY, github.ref_name) || '' }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=backend-migrator
          cache-to: type=gha,scope=backend-migrator,mode=max

      - name: Build web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/testinbox-web:${{ github.sha }}
            ${{ inputs.push && format('{0}/testinbox-web:{1}', env.REGISTRY, github.ref_name) || '' }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # A real gate, not documentation: the Dockerfile's USER line is one
      # deletion away from silently producing root containers, and nothing else
      # in the pipeline would notice.
      # A real gate, not documentation: the Dockerfile's USER line is one
      # deletion away from silently producing root containers, and nothing else
      # in the pipeline would notice.
      - name: Assert every runtime image runs as a non-root user
        run: |
          set -uo pipefail

          # Returns non-zero when the image runs as root. It reports, it does
          # not decide — the callers below differ in what a root image means.
          assert_nonroot() {
            local ref="$1" uid
            uid=$(docker run --rm --entrypoint sh "$ref" -c 'id -u') || return 2
            [[ "$uid" != "0" ]] || return 1
            echo "ok — $ref runs as uid $uid"
          }

          # Positive control. Without it a check that always succeeded would
          # pass every image, and the gate would be indistinguishable from none.
          if assert_nonroot "alpine:3.22"; then
            echo "::error::the non-root check accepted a known-root image — the gate is broken"
            exit 1
          fi
          echo "ok — the check correctly rejects a known-root image"

          fail=0
          for image in api ingestion migrator web; do
            if [[ "${{ inputs.push }}" == "true" ]]; then
              # Address the pushed artifact by digest, so the assertion is made
              # about the exact bytes that will be deployed.
              case "$image" in
                api)       digest='${{ steps.api.outputs.digest }}' ;;
                ingestion) digest='${{ steps.ingestion.outputs.digest }}' ;;
                migrator)  digest='${{ steps.migrator.outputs.digest }}' ;;
                web)       digest='${{ steps.web.outputs.digest }}' ;;
              esac
              ref="${REGISTRY}/testinbox-${image}@${digest}"
            else
              ref="${REGISTRY}/testinbox-${image}:${{ github.sha }}"
            fi
            assert_nonroot "$ref" || { echo "::error::$ref runs as root (uid 0)"; fail=1; }
          done
          exit "$fail"

      # One step per image: the action attests a single subject, and attesting
      # only the api image while the other three ship unattested is worse than
      # not claiming provenance at all.
      - name: Attest api provenance
        if: inputs.push
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/testinbox-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest ingestion provenance
        if: inputs.push
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/testinbox-ingestion
          subject-digest: ${{ steps.ingestion.outputs.digest }}
          push-to-registry: true

      - name: Attest migrator provenance
        if: inputs.push
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/testinbox-migrator
          subject-digest: ${{ steps.migrator.outputs.digest }}
          push-to-registry: true

      - name: Attest web provenance
        if: inputs.push
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/testinbox-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      # Informational on this path by construction: `deploy-staging.yml` never
      # sets `enforce_vulnerability_policy`. The blocking half runs on the
      # promotion path, against the digests that were actually published —
      # see `release-candidate.yml`. Policy and its self-tests live in
      # `scripts/scan-images.sh`.
      - name: Container vulnerability scan (informational)
        if: inputs.push
        continue-on-error: true
        env:
          TRIVY_VERSION: 0.68.0
        run: |
          set -euo pipefail
          ./scripts/install-trivy.sh
          ENFORCE=false TRIVY_BIN=/tmp/trivy ./scripts/scan-images.sh \
            "${REGISTRY}/testinbox-api@${{ steps.api.outputs.digest }}" \
            "${REGISTRY}/testinbox-ingestion@${{ steps.ingestion.outputs.digest }}" \
            "${REGISTRY}/testinbox-migrator@${{ steps.migrator.outputs.digest }}" \
            "${REGISTRY}/testinbox-web@${{ steps.web.outputs.digest }}"

      - name: Record digests
        if: inputs.push
        run: |
          {
            echo "### Immutable artifacts"
            echo
            echo "| image | digest |"
            echo "|---|---|"
            echo "| testinbox-api | \`${{ steps.api.outputs.digest }}\` |"
            echo "| testinbox-ingestion | \`${{ steps.ingestion.outputs.digest }}\` |"
            echo "| testinbox-migrator | \`${{ steps.migrator.outputs.digest }}\` |"
            echo "| testinbox-web | \`${{ steps.web.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
