name: Staging

# develop → immutable artifacts → ephemeral rehearsal → release handoff.
#
# WHERE THIS WORKFLOW STOPS (ADR-030). Persistent staging runs on the Infinity
# estate, which is pull-based: this workflow builds artifacts, proves them
# against a full ephemeral copy of the deployment, and hands their immutable
# identity to GitLab `infinity/infinity-core`. It does not deploy, and it holds
# no credential for the staging host.
#
# So the last job is called `handoff`, not `deploy`, and nothing here reports a
# deployment as successful. The authoritative staging verdict — reconcile,
# migration, readiness, post-deployment synthetic suite — lives in Ops.
#
# The ephemeral rehearsal is NOT redundant with that. It proves the
# provider-neutral deployment stack the application owns (ADR-030 keeps the
# nginx topology as the reference implementation for self-hosted deployments),
# and it is the only one of the two that gates a pull request.
#
# `develop` is the staging candidate; `master` is the production-approved
# candidate. Nothing here deploys production, and no master→production
# automation exists.

on:
  push:
    branches: [develop]
  # Feature PRs are never deployed to shared staging (§6). They do run the
  # image build and the ephemeral rehearsal, because a deployment path that is
  # only exercised after merge is a deployment path that breaks after merge.
  pull_request:
    paths:
      - "deploy/**"
      - "backend/**"
      - "web/**"
      - "sdk/**"
      - "scripts/**"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      api_image:
        description: "Redeploy/rollback: full api reference (ghcr.io/OWNER/testinbox-api@sha256:...). Leave all four blank to build from this ref."
        required: false
      ingestion_image:
        required: false
      migrator_image:
        required: false
      web_image:
        required: false

concurrency:
  # Scoped per ref, so an ephemeral PR rehearsal never contends with a real
  # deployment. GitHub keeps only ONE pending run per group and cancels earlier
  # pending ones — a single shared group would let a queued develop deployment
  # be dropped by the next pull request.
  group: testinbox-staging-${{ github.ref }}
  # NEVER cancel in progress: a cancelled run can interrupt a rehearsal
  # mid-migration, and it can also cancel a handoff between validation and the
  # trigger.
  #
  # NOTE what this no longer guarantees. When the migration ran inside this
  # workflow, the group serialised deployments. The handoff returns as soon as
  # GitLab accepts the trigger, so two rapid merges can hand over two
  # candidates while the first is still reconciling. Serialising the actual
  # deployment is now an Ops responsibility, recorded as a contract requirement
  # in ADR-030 ("What Ops must guarantee").
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # A manual redeploy/rollback supplies digests instead of building. They are
  # validated here, before anything is pulled: without this, "redeploy" would
  # accept an arbitrary image from an arbitrary registry (§29).
  # ---------------------------------------------------------------------------
  resolve-artifacts:
    name: Resolve artifacts
    runs-on: ubuntu-latest
    outputs:
      supplied: ${{ steps.check.outputs.supplied }}
      api: ${{ steps.check.outputs.api }}
      ingestion: ${{ steps.check.outputs.ingestion }}
      migrator: ${{ steps.check.outputs.migrator }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the digest validator
        run: ./scripts/validate-image-digest.test.sh
      - id: check
        env:
          API: ${{ inputs.api_image }}
          INGESTION: ${{ inputs.ingestion_image }}
          MIGRATOR: ${{ inputs.migrator_image }}
          WEB: ${{ inputs.web_image }}
        run: |
          set -euo pipefail
          supplied=0
          for value in "$API" "$INGESTION" "$MIGRATOR" "$WEB"; do
            [[ -n "$value" ]] && supplied=$((supplied + 1))
          done
          if (( supplied == 0 )); then
            echo "supplied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( supplied != 4 )); then
            echo "::error::Supply all four image references or none; got $supplied."
            exit 1
          fi
          EXPECTED_IMAGE_REPOSITORY="ghcr.io/${{ github.repository_owner }}" \
            ./scripts/validate-image-digest.sh "$API" "$INGESTION" "$MIGRATOR" "$WEB"
          {
            echo "supplied=true"
            echo "api=$API"
            echo "ingestion=$INGESTION"
            echo "migrator=$MIGRATOR"
            echo "web=$WEB"
          } >> "$GITHUB_OUTPUT"

  # Two call sites rather than one with a conditional `push:`, because a job's
  # `permissions:` block cannot be conditional. A same-repo pull request runs
  # the workflow file *as the PR edited it*; if that path were granted
  # `packages: write` and an OIDC identity, `push: false` would be the only
  # thing standing between a PR and a published artifact — and a PR can edit
  # that too. The PR path therefore holds nothing to abuse.
  build-pr:
    name: Immutable artifacts (build only)
    needs: resolve-artifacts
    if: github.event_name == 'pull_request' && needs.resolve-artifacts.outputs.supplied != 'true'
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
    with:
      push: false

  build:
    name: Immutable artifacts
    needs: resolve-artifacts
    if: github.event_name != 'pull_request' && needs.resolve-artifacts.outputs.supplied != 'true'
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      push: true

  # ---------------------------------------------------------------------------
  # The whole deployment, executed for real against an ephemeral copy of the
  # staging topology on the runner: images deployed BY DIGEST from a registry,
  # one migration job gated on, readiness that reflects the database/schema/
  # object store/LISTEN connection, real TLS through real nginx, and the
  # post-deployment synthetic suite driven by the public SDK.
  #
  # This is not a deployment — nothing is reachable off the runner — and it
  # selects no provider. It is what makes the pipeline verifiable while ADR-030
  # is outstanding, and it stays valuable afterwards as a pre-merge gate.
  # ---------------------------------------------------------------------------
  rehearsal:
    name: Ephemeral staging rehearsal + synthetic suite
    needs: resolve-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run the rehearsal
        # Bounded at the step, not only the job: a hung docker build would
        # otherwise burn the full job timeout before printing anything.
        timeout-minutes: 35
        run: ./scripts/staging-rehearsal.sh
      - name: Record the outcome
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "Rehearsal PASSED — migration, readiness, TLS ingress, long-poll window and the full synthetic workflow all verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rehearsal FAILED — see the job log; container logs are printed on teardown." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Release handoff to the Infinity Ops platform (ADR-030).
  #
  # This job does NOT deploy. The Infinity estate is pull-based: GitHub builds
  # and proves artifacts, then hands their immutable identity to GitLab
  # `infinity/infinity-core`, which reconciles the staging host. GitHub holds no
  # SSH key, no database credential and no synthetic API key — the previous
  # push-based path did, and removing it removes that blast radius entirely.
  #
  # The environment is deliberately `staging-handoff`, not `staging`. A GitHub
  # Environment named for the target would render this as "deployed to staging"
  # in the commit and PR UI, which would be false: a 2xx from the trigger API
  # means the release candidate was accepted for deployment, nothing more.
  # Deployment, migration, readiness and the post-deployment synthetic suite all
  # run asynchronously in Ops, and their verdict lives there
  # (docs/dev/deployment.md).
  # ---------------------------------------------------------------------------
  handoff:
    name: Release handoff to GitLab Ops
    needs: [resolve-artifacts, build, rehearsal]
    # `always()` so a skipped `build` (manual redeploy path) does not skip this.
    # The ref guard stays load-bearing: only `develop` is a staging candidate,
    # and a dispatch from an unreviewed branch would otherwise supply both the
    # digests and the validator that is meant to check them.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      github.ref_name == 'develop' &&
      needs.rehearsal.result == 'success' &&
      (needs.build.result == 'success' || needs.resolve-artifacts.outputs.supplied == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging-handoff
    steps:
      - uses: actions/checkout@v7

      - name: Self-test the handoff contract
        # Runs before the real handoff, so a broken payload builder is caught
        # here rather than by Ops rejecting an opaque pipeline.
        run: ./scripts/gitlab-handoff.test.sh

      - name: Resolve the digest set to hand off
        id: artifacts
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.resolve-artifacts.outputs.supplied }}" == "true" ]]; then
            api='${{ needs.resolve-artifacts.outputs.api }}'
            ingestion='${{ needs.resolve-artifacts.outputs.ingestion }}'
            migrator='${{ needs.resolve-artifacts.outputs.migrator }}'
            web='${{ needs.resolve-artifacts.outputs.web }}'
          else
            api="${REGISTRY}/testinbox-api@${{ needs.build.outputs.api-digest }}"
            ingestion="${REGISTRY}/testinbox-ingestion@${{ needs.build.outputs.ingestion-digest }}"
            migrator="${REGISTRY}/testinbox-migrator@${{ needs.build.outputs.migrator-digest }}"
            web="${REGISTRY}/testinbox-web@${{ needs.build.outputs.web-digest }}"
          fi
          EXPECTED_IMAGE_REPOSITORY="$REGISTRY" \
            ./scripts/validate-image-digest.sh "$api" "$ingestion" "$migrator" "$web"
          {
            echo "api=$api"
            echo "ingestion=$ingestion"
            echo "migrator=$migrator"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"

      - name: Hand the release candidate to GitLab Ops
        id: handoff
        env:
          # The only cross-system credential GitHub holds for this path, and it
          # can do exactly one thing: start a pipeline in infinity-core.
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          # gitlab-handoff.sh defaults GITLAB_API_URL to gitlab.com. That default is
          # right for the repository — no Ops platform is assumed — but it means the
          # host MUST be passed explicitly here, or the trigger token is POSTed to
          # gitlab.com. Deliberately no `||` fallback: an unset variable has to fail
          # the run, not silently send a credential to the wrong host.
          GITLAB_API_URL: ${{ vars.GITLAB_OPS_API_URL }}
          GITLAB_PROJECT: ${{ vars.GITLAB_OPS_PROJECT || 'infinity%2Finfinity-core' }}
          GITLAB_REF: ${{ vars.GITLAB_OPS_REF || 'develop' }}
          EXPECTED_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ -z "${GITLAB_TRIGGER_TOKEN:-}" ]]; then
            echo "::error::GITLAB_TRIGGER_TOKEN is not set on the staging-handoff environment"
            exit 1
          fi
          if [[ -z "${GITLAB_API_URL:-}" ]]; then
            echo "::error::GITLAB_OPS_API_URL is not set on the staging-handoff environment."
            echo "::error::Without it the handoff would POST the trigger token to the"
            echo "::error::gitlab.com default. Set it to the Ops instance API root."
            exit 1
          fi
          ./scripts/gitlab-handoff.sh \
            --commit "${{ github.sha }}" \
            --api "${{ steps.artifacts.outputs.api }}" \
            --ingestion "${{ steps.artifacts.outputs.ingestion }}" \
            --migrator "${{ steps.artifacts.outputs.migrator }}" \
            --web "${{ steps.artifacts.outputs.web }}"

      - name: Record the handoff
        if: always()
        run: |
          {
            if [[ "${{ steps.handoff.outcome }}" == "success" ]]; then
              echo "## Release candidate handed to GitLab Ops"
              echo
              echo "The Ops pipeline has **accepted** this release candidate. That is not"
              echo "the same as a successful deployment: the host reconcile, the migration"
              echo "job, readiness and the post-deployment synthetic suite run"
              echo "asynchronously in \`infinity/infinity-core\`, and **the authoritative"
              echo "staging verdict lives there**, not in this workflow run."
            else
              echo "## Release handoff FAILED"
              echo
              echo "Nothing was handed to Ops; staging continues to run whatever it was"
              echo "already running."
            fi
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| handoff target | staging (deployed by Ops) |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| triggered by | ${{ github.actor }} (${{ github.event_name }}) |"
            echo "| api | \`${{ steps.artifacts.outputs.api }}\` |"
            echo "| ingestion | \`${{ steps.artifacts.outputs.ingestion }}\` |"
            echo "| migrator | \`${{ steps.artifacts.outputs.migrator }}\` |"
            echo "| web | \`${{ steps.artifacts.outputs.web }}\` |"
            echo "| handoff result | ${{ steps.handoff.outcome }} |"
            echo "| gitlab pipeline | ${{ steps.handoff.outputs.pipeline_url || 'n/a' }} |"
            echo "| handed off at | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
