name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contract-lint:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spectral lint (contract-first, ADR-022)
        run: npx --yes @stoplight/spectral-cli@6 lint backend/api/contract/openapi.yaml --ruleset .spectral.yaml --fail-severity error

  backend:
    name: Backend (format, compile, unit + integration + architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Formatting
        working-directory: backend
        run: ./gradlew spotlessCheck
      - name: Build and test (excluding e2e)
        working-directory: backend
        run: ./gradlew build -x :e2e:test
      - name: Verify test suites actually produced results
        run: ./scripts/verify-test-results.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests/test

  e2e:
    name: Acceptance (black-box, Karate, JVM + TS SDK live)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Install TS SDK dependencies (used by the live SDK e2e test)
        working-directory: sdk/typescript
        run: npm ci
      - name: Run e2e acceptance suite
        working-directory: backend
        run: ./gradlew :e2e:test
      - name: Verify e2e suites produced results
        run: VERIFY_E2E=true ./scripts/verify-test-results.sh
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: backend/e2e/build/reports/tests/test

  sdk-kotlin:
    name: JVM SDK (Java 17 baseline, consumer matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ADR-023 consumer perspective: the artifact must serve 17/21/25.
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: sdk/kotlin
        run: ./gradlew build
      - name: Assert Java 17 bytecode
        working-directory: sdk/kotlin
        run: |
          CLS=$(find build/classes -name 'TestInboxClient.class' | head -1)
          MAJOR=$(javap -v "$CLS" | grep -m1 'major version' | grep -o '[0-9]*')
          test "$MAJOR" = "61" || { echo "expected Java 17 bytecode (major 61), got $MAJOR"; exit 1; }
      - name: Verify SDK tests produced results
        working-directory: sdk/kotlin
        run: |
          COUNT=$(grep -ho 'tests="[0-9]*"' build/test-results/test/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
          test "${COUNT:-0}" -ge 8 || { echo "expected >= 8 SDK tests, got ${COUNT:-0}"; exit 1; }

  sdk-typescript:
    name: TypeScript SDK (consumer matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - working-directory: sdk/typescript
        run: npm ci
      - working-directory: sdk/typescript
        run: npm run build
      - working-directory: sdk/typescript
        run: npm test

  web:
    name: Web UI (build + Playwright sandbox proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm test
