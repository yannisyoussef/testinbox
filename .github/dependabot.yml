# Dependency update automation (docs/quality/strategy.md).
# Grouped and weekly to keep PR volume reviewable: a noisy update bot gets
# ignored, which is worse than no bot.
version: 2
updates:
  # target-branch: develop on every ecosystem — `develop` is the integration
  # branch; `master` only moves on release. Left at the default, Dependabot
  # opened every PR against `master` and they aged out against a baseline
  # 50 commits behind, with stale green checks that predated a third-party
  # registry change. Note this file is read from the DEFAULT branch, so a
  # change here only takes effect once it reaches `master`.
  - package-ecosystem: gradle
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /sdk/kotlin
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      sdk-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/typescript
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      sdk-typescript:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
