# Local development dependencies (docs/dev/local-setup.md).
# Postgres is the sole system of record (ADR-006); MinIO provides
# S3-compatible object storage for raw MIME/attachments (ADR-005).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testinbox
      POSTGRES_USER: testinbox
      POSTGRES_PASSWORD: testinbox
    ports:
      - "${TESTINBOX_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testinbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Our own private mirror of MinIO's withdrawn RELEASE.2025-04-22T22-12-26Z —
    # the same bytes, not an upgrade. Pinned by INDEX digest so an amd64 runner
    # and an arm64 laptop each resolve their own member natively. Requires
    # `docker login ghcr.io` (docs/dev/third-party-mirrors.md).
    image: ghcr.io/yannisyoussef/testinbox-mirror/minio@sha256:bbac678936882e4033b6068efd0a19d103b219002d979087f7c5bd330172e00d
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testinbox
      MINIO_ROOT_PASSWORD: testinbox123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
