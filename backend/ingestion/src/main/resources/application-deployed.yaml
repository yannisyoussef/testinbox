# The DEPLOYED layer for the inbound SMTP gateway (ADR-028/029/034), pulled in
# by the `staging` and `production` profile groups in application.yaml. See the
# API's application-deployed.yaml for why nothing here has a default, and for
# why the production overrides are the second document of THIS file rather
# than a separate profile file (which the group order would shadow).
server:
  # HTTP here carries actuator only; it is never routed by the ingress.
  port: 8081
  shutdown: graceful

spring:
  datasource:
    url: ${TESTINBOX_DB_URL}
    username: ${TESTINBOX_DB_USER}
    password: ${TESTINBOX_DB_PASSWORD}
    hikari:
      # T1's pool. Under ALL, DeploymentSafety refuses to start unless Hikari's
      # effective maximumPoolSize equals the pool size the approved INGEST
      # envelope's evidence covers (IngestEnvelopeSafety.APPROVED_ENVELOPES).
      maximum-pool-size: ${TESTINBOX_DB_POOL_SIZE:8}
  flyway:
    enabled: false
  lifecycle:
    # An in-flight DATA transaction must finish and commit, or the sender
    # retries a delivery we half-processed.
    timeout-per-shutdown-phase: ${TESTINBOX_SHUTDOWN_GRACE:45s}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

testinbox:
  mail-domain: ${TESTINBOX_MAIL_DOMAIN}
  wait-window-cap: ${TESTINBOX_WAIT_WINDOW_CAP:60s}
  # N, the closed beta's participant cap (docs/dev/beta-limits.md): 1..30, and
  # 30 when unset. It may only LOWER the cohort's thirty places; lowering it
  # evicts nobody, it only stops new admissions. The API admits to it and both
  # deployables compute the INGEST envelope r x (N + L) from it, so set it
  # identically on both. Under ALL an N the owner approved no envelope for is
  # refused at startup (IngestEnvelopeSafety).
  beta:
    max-participants: ${TESTINBOX_BETA_MAX_PARTICIPANTS:30}
  # The closed-beta INGEST envelope (ADR-035 amendment D, owner decision
  # 2026-11-06; docs/dev/beta-limits.md). INCOMING recipient copies, charged
  # per inbox first, then per workspace; TestInbox sends no mail. A copy over
  # budget is discarded with the uniform SMTP 250 and counted as
  # ingest_rate_limited, never queued. Shared by staging and production so
  # staging rehearses the production envelope. Under ALL, DeploymentSafety
  # refuses a burst above 60, a refill whose r x (N + L) exceeds
  # TESTINBOX_STORAGE_GATED_EXPECTED_RATE, and a per-inbox value above the
  # workspace's. The library defaults (300/10 and 60/2) stay for development.
  limits:
    ingest:
      capacity: ${TESTINBOX_LIMITS_INGEST_CAPACITY:60}
      refill-per-second: ${TESTINBOX_LIMITS_INGEST_REFILL_PER_SECOND:1.0}
    ingest-per-inbox:
      capacity: ${TESTINBOX_LIMITS_INGEST_PER_INBOX_CAPACITY:30}
      refill-per-second: ${TESTINBOX_LIMITS_INGEST_PER_INBOX_REFILL_PER_SECOND:0.5}
  smtp:
    port: ${TESTINBOX_SMTP_PORT:2525}
  storage:
    endpoint: ${TESTINBOX_S3_ENDPOINT}
    region: ${TESTINBOX_S3_REGION:us-east-1}
    access-key: ${TESTINBOX_S3_ACCESS_KEY}
    secret-key: ${TESTINBOX_S3_SECRET_KEY}
    bucket: ${TESTINBOX_S3_BUCKET:testinbox-mime}
    create-bucket: ${TESTINBOX_S3_CREATE_BUCKET:true}
    # ADR-035 §14 / TI-STORAGE-006: OFF | TENANT_LIMITS | ALL. The default, and
    # the only value any committed environment may carry, is OFF
    # (scripts/check-storage-enforcement-off.sh). A non-OFF value is refused at
    # startup unless every §18 declaration below is set and consistent (the
    # bucket quota and churn figure are OPTIONAL since ADR-035 Amendment 2), and
    # the declared backend matches a shipped qualification record (§9a).
    enforcement: ${TESTINBOX_STORAGE_ENFORCEMENT:OFF}
    global-limit-bytes: ${TESTINBOX_STORAGE_GLOBAL_LIMIT_BYTES:}
    declared-bucket-quota-bytes: ${TESTINBOX_STORAGE_DECLARED_BUCKET_QUOTA_BYTES:}
    declared-max-ingestion-processes: ${TESTINBOX_STORAGE_DECLARED_MAX_INGESTION_PROCESSES:}
    inbox-share: ${TESTINBOX_STORAGE_INBOX_SHARE:}
    measured-quota-lag-churn-bytes: ${TESTINBOX_STORAGE_MEASURED_QUOTA_LAG_CHURN_BYTES:}
    # ADR-035 amendment D: R_gated, the §11 expected rate (events/s) of the
    # passing gate D evidence, and L, the legacy-share workspaces beside the N
    # participant places. No defaults: ALL is refused while either is unset.
    gated-expected-rate: ${TESTINBOX_STORAGE_GATED_EXPECTED_RATE:}
    declared-legacy-workspaces: ${TESTINBOX_STORAGE_DECLARED_LEGACY_WORKSPACES:}
    activation:
      expected-api-nodes: ${TESTINBOX_STORAGE_EXPECTED_API_NODES:}
      expected-ingestion-nodes: ${TESTINBOX_STORAGE_EXPECTED_INGESTION_NODES:}
    # The dedicated filesystem's declared budgets (filesystem-containment
    # contract, TI-STORAGE-006E). Declarations, not proof: gate F verifies them.
    filesystem:
      block-size-bytes: ${TESTINBOX_STORAGE_FS_BLOCK_SIZE_BYTES:}
      object-overhead-max-bytes: ${TESTINBOX_STORAGE_FS_OBJECT_OVERHEAD_MAX_BYTES:}
      global-footprint-limit-bytes: ${TESTINBOX_STORAGE_FS_GLOBAL_FOOTPRINT_LIMIT_BYTES:}
      deletion-debt-budget-bytes: ${TESTINBOX_STORAGE_FS_DELETION_DEBT_BUDGET_BYTES:}
      metadata-budget-bytes: ${TESTINBOX_STORAGE_FS_METADATA_BUDGET_BYTES:}
      operational-reserve-bytes: ${TESTINBOX_STORAGE_FS_OPERATIONAL_RESERVE_BYTES:}
      capacity-bytes: ${TESTINBOX_STORAGE_FS_CAPACITY_BYTES:}
      inodes: ${TESTINBOX_STORAGE_FS_INODES:}
      observation-max-age: ${TESTINBOX_STORAGE_FS_OBSERVATION_MAX_AGE:}
      probe-budget-bytes: ${TESTINBOX_STORAGE_FS_PROBE_BUDGET_BYTES:}
      monitor-role: ${TESTINBOX_STORAGE_FS_MONITOR_ROLE:}
      retention-pacing-max-delay: ${TESTINBOX_STORAGE_FS_RETENTION_PACING_MAX_DELAY:}
    # Issue #102: a qualification record read from a FILE, for the isolated
    # lab only. Refused at startup unless TESTINBOX_ENVIRONMENT is exactly
    # "lab" (staging and production never set it), and never enablement
    # evidence: it lets the lab run the current upload implementation under
    # an enforcing mode before a record qualified on it exists.
    qualification:
      lab-record-path: ${TESTINBOX_STORAGE_QUALIFICATION_LAB_RECORD_PATH:}
  deployment:
    environment: ${TESTINBOX_ENVIRONMENT}
    proxy-read-timeout: ${TESTINBOX_PROXY_READ_TIMEOUT}
    # Hard ceiling the environment's ingress imposes on ANY request. Cloudflare
    # caps at ~100s on the deployed staging path (ADR-030) and no application
    # setting raises it, so the wait window must fit underneath. Unset where the
    # ingress is ours and imposes no ceiling of its own.
    edge-request-ceiling: ${TESTINBOX_EDGE_REQUEST_CEILING:}
    git-sha: ${TESTINBOX_GIT_SHA:unknown}
    image-digest: ${TESTINBOX_IMAGE_DIGEST:unknown}

management:
  server:
    port: ${TESTINBOX_MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # The listener socket is this deployable's entire purpose; a context
          # that came up without it must not be called ready. The V22 eligibility
          # view is read by every T1: without its grant all mail would get 451.
          include: readinessState,db,schema,objectStorage,smtpListener,lifecyclePrivileges
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: false
    os:
      enabled: false
    process:
      enabled: false
  metrics:
    tags:
      service: testinbox-ingestion
      environment: ${TESTINBOX_ENVIRONMENT}

info:
  testinbox:
    environment: ${TESTINBOX_ENVIRONMENT}
    gitSha: ${TESTINBOX_GIT_SHA:unknown}
    imageDigest: ${TESTINBOX_IMAGE_DIGEST:unknown}

---
# Production overrides (ADR-034 §4). Enforcement is `DeploymentSafety`, not
# this document — see the API's application-deployed.yaml.
spring:
  config:
    activate:
      on-profile: production

testinbox:
  mail-domain: inbox.testinbox.email
  storage:
    create-bucket: false
