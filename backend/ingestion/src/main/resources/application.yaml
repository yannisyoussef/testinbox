server:
  port: 8081

spring:
  application:
    name: testinbox-ingestion
  profiles:
    # Same shape as the API (ADR-034): one deployed layer, two environments.
    group:
      staging: deployed
      production: deployed
  datasource:
    url: ${TESTINBOX_DB_URL:jdbc:postgresql://localhost:5432/testinbox}
    username: ${TESTINBOX_DB_USER:testinbox}
    password: ${TESTINBOX_DB_PASSWORD:testinbox}
    hikari:
      data-source-properties:
        # ADR-035 §14 (a): testinbox-<service>:<node>:storage-v1, the capability allowlist.
        ApplicationName: testinbox-ingestion:${testinbox.storage.node-id}:storage-v1
  flyway:
    enabled: true

testinbox:
  mail-domain: ${TESTINBOX_MAIL_DOMAIN:testinbox.local}
  smtp:
    port: ${TESTINBOX_SMTP_PORT:2525}
  storage:
    # ADR-035 §9: stable across restarts; persisted ambiguity is counted per node.
    node-id: ${TESTINBOX_STORAGE_NODE_ID:testinbox-ingestion}
    endpoint: ${TESTINBOX_S3_ENDPOINT:http://localhost:9000}
    access-key: ${TESTINBOX_S3_ACCESS_KEY:testinbox}
    secret-key: ${TESTINBOX_S3_SECRET_KEY:testinbox123}
    bucket: testinbox-mime

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
