openapi: 3.1.0
info:
  title: TestInbox API
  version: 1.0.0-experimental
  description: |
    TestInbox v1 REST contract — hand-authored and committed (ADR-022);
    this document is the source of truth for the REST surface. Changes
    within v1 must be additive only (ADR-015). Errors use RFC 7807
    (`application/problem+json`) with stable `type` URIs under
    `https://testinbox.email/problems/`.

    Pre-v1 stability is signalled via the `X-API-Stability: experimental`
    response header rather than by breaking silently.

    **Idempotency.** `POST /v1/inboxes` and `POST /v1/api-keys` accept an
    optional `Idempotency-Key` header (ADR-033) so a client that loses a
    response can retry without creating a second resource. Records are retained
    for a bounded window (six hours by default) and then expire. Note that
    `POST /v1/api-keys` **suppresses the duplicate rather than replaying the
    response**: the credential is returned exactly once and is unrecoverable,
    so a replay is `409 idempotency-secret-not-replayable` naming the key that
    was created.

    **Transport-level refusals apply to every operation** and are therefore not
    repeated on each one. All use `application/problem+json` with a stable
    `type` and a `correlationId`:

    - `401 unauthorized` — no or invalid credential. Returned *before* routing,
      so an unknown path is indistinguishable from a known one to an
      unauthenticated caller.
    - `404 not-found` — no such path.
    - `405 method-not-allowed` — known path, wrong method. Carries `Allow`.
    - `406 not-acceptable` / `415 unsupported-media-type` — content negotiation.
    - `503 schema-unavailable` — the node's schema is behind its artifact
      (ADR-029); carries `Retry-After`.

    None of these is a `5xx`. A `500` from this API means a server fault, which
    is what makes it worth alerting on.
servers:
  - url: /v1
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >
        Workspace/project-scoped API key (ADR-010, ADR-032). Structured rather
        than fully opaque — `ti_k1_<publicId>_<secret>_<check>` — so a
        credential is recognisable to a secret scanner and a truncated paste is
        detectable. Only the `publicId` segment is non-secret.
  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Opaque, client-chosen key making a retry of *this* logical request safe
        (ADR-033). 16–255 printable ASCII characters; not required to be a
        UUID, and the server infers nothing from its content.

        Scoped to the caller's workspace and this operation, so the same value
        is safe for unrelated tenants and for a different endpoint. It survives
        credential rotation: retrying with a different key of the same
        workspace still replays.

        The key is bound to the *semantic* content of the request. Retrying the
        same request replays the committed result; sending a different request
        under the same key is `409 idempotency-key-reused` and never executes.

        Only a **committed success** binds the key. A validation error, a quota
        refusal or an address conflict leaves it unbound, so a corrected retry
        with the same key executes normally.

        Sending it to an operation that does not support it is refused rather
        than ignored — see `idempotency-not-supported`.
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: "^[\\x21-\\x7e]+$"
    inboxId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    messageId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    idempotencyReplayed:
      description: >
        Present and `true` when this response replays a previously committed
        result rather than performing the mutation (ADR-033).
      schema: { type: boolean }
    correlationId:
      description: Correlation id echoed in logs/traces and RFC 7807 bodies.
      schema: { type: string }
    rateLimitLimit:
      description: Burst capacity of the bucket governing this request (ADR-027).
      schema: { type: integer, format: int64 }
    rateLimitRemaining:
      description: Whole tokens left in that bucket after this request.
      schema: { type: integer, format: int64 }
    rateLimitReset:
      description: Seconds until at least one token is available again.
      schema: { type: integer, format: int64 }
    retryAfter:
      description: >
        RFC 9110 Retry-After, in whole seconds. Present only where waiting
        actually helps — never on a quota refusal, which waiting cannot fix.
      schema: { type: integer, format: int64 }
  responses:
    RateLimited:
      description: >
        Too many requests for this workspace
        (`type: https://testinbox.email/problems/rate-limit-exceeded`).
        Limits are workspace-scoped and derived from the authenticated API
        key, so rotating a key does not reset them.
      headers:
        Retry-After: { $ref: "#/components/headers/retryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/rateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/rateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/rateLimitReset" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: RFC 7807 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        retryAfterSeconds:
          type: integer
          description: >
            Seconds until a retry may succeed. Present on rate-limit and
            concurrent-wait refusals, and on address-already-reserved
            conflicts still in cooldown (ADR-021). Absent on quota-exceeded,
            where waiting does not help.
        category:
          type: string
          description: Rate category that refused the request (ADR-027).
        quota:
          type: string
          description: Quota dimension that is exhausted, on quota-exceeded.
        limit:
          type: integer
          format: int64
          description: Configured allowance for the exceeded limit.
        current:
          type: integer
          format: int64
          description: Current consumption of the exceeded quota dimension.
        apiKeyId:
          type: string
          format: uuid
          description: >
            On `idempotency-secret-not-replayable`, the credential this request
            already created.
        publicId:
          type: string
          description: >
            On `idempotency-secret-not-replayable`, that credential's non-secret
            handle.
      required: [type, title, status]
    AddressMode:
      type: string
      description: >
        Addressing mode (ADR-021). Clients must tolerate unknown future
        values.
      enum: [GENERATED, EXACT]
    InboxState:
      type: string
      description: Clients must tolerate unknown future values.
      enum: [ACTIVE, EXPIRING, EXPIRED, DELETED]
    ParseStatus:
      type: string
      enum: [OK, FAILED]
    CreateInboxRequest:
      type: object
      properties:
        addressMode:
          allOf: [{ $ref: "#/components/schemas/AddressMode" }]
          default: GENERATED
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Defaults to the deployment default TTL; capped at the deployment maximum.
        aliasHint:
          type: string
          description: GENERATED mode only — human-readable prefix; the address always carries a random token.
        localPart:
          type: string
          description: EXACT mode only — the exact local-part to reserve (409 on conflict, ADR-021).
    Inbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        addressMode: { $ref: "#/components/schemas/AddressMode" }
        state: { $ref: "#/components/schemas/InboxState" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      required: [id, address, addressMode, state, createdAt, expiresAt]
    EmailHeader:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
      required: [name, value]
    EmailLink:
      type: object
      properties:
        href: { type: string }
        text: { type: string }
      required: [href]
    AttachmentMeta:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName:
          type: string
          description: Sender-supplied, unsanitized display metadata — never a storage path.
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
      required: [id, sizeBytes]
    Message:
      type: object
      description: >
        A received message. Parsed fields are absent when parseStatus is
        FAILED; the raw MIME remains at `/v1/messages/{id}/raw` (ADR-005).
      properties:
        id: { type: string, format: uuid }
        inboxId: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        envelopeFrom: { type: string }
        envelopeTo: { type: string }
        parseStatus: { $ref: "#/components/schemas/ParseStatus" }
        parseError: { type: string }
        from:
          type: string
          description: Parsed From address (address part only).
        fromHeader:
          type: string
          description: Raw From header value.
        toHeader: { type: string }
        subject: { type: string }
        textBody: { type: string }
        htmlBody:
          type: string
          description: >
            Untrusted sender-controlled HTML. Never render on a primary
            origin; sandboxed isolated rendering only (ADR-011).
        headers:
          type: array
          items: { $ref: "#/components/schemas/EmailHeader" }
        links:
          type: array
          description: Extracted links — data only; TestInbox never fetches them.
          items: { $ref: "#/components/schemas/EmailLink" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentMeta" }
        contentFingerprint:
          type: string
          description: SHA-256 of raw MIME — informational annotation, never a dedup key (ADR-019).
        possibleDuplicateOfMessageId:
          type: string
          format: uuid
          description: Earliest message in this inbox sharing the fingerprint (ADR-019 annotation).
        rawSizeBytes: { type: integer, format: int64 }
      required: [id, inboxId, receivedAt, envelopeTo, parseStatus, contentFingerprint, rawSizeBytes]
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor:
          type: string
          description: Opaque cursor; absent when no further page exists.
      required: [items]
    MessageMatcher:
      type: object
      description: A message matches iff ALL specified fields match. ParseFailed messages never match.
      properties:
        from:
          type: string
          description: Case-insensitive exact match on the parsed From address (or the raw From header).
        subjectContains: { type: string }
        subjectEquals: { type: string }
        headers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value:
                type: string
                description: Omit to match on header presence alone.
            required: [name]
    WaitRequest:
      type: object
      properties:
        matcher:
          allOf: [{ $ref: "#/components/schemas/MessageMatcher" }]
          description: Empty/omitted matcher matches the first parsed message.
        timeoutSeconds:
          type: integer
          format: int64
          minimum: 1
          default: 30
          description: >
            Requested wait window; the server caps a single call (default
            cap 60s). SDKs chain calls for longer caller timeouts
            (ADR-012/020).
      required: [timeoutSeconds]
    WaitResult:
      type: object
      description: >
        Wait outcome (ADR-020). `status: TIMEOUT` is a successful query
        with a negative answer — never an HTTP error. Clients must
        tolerate unknown future status values.
      properties:
        status:
          type: string
          enum: [MATCHED, TIMEOUT]
        message:
          allOf: [{ $ref: "#/components/schemas/Message" }]
          description: Present iff status is MATCHED.
        elapsedMs: { type: integer, format: int64 }
        arrivedButUnmatchedCount:
          type: integer
          description: Messages that became visible during the window but did not satisfy the matcher.
        parseFailedCount:
          type: integer
          description: Messages that became visible during the window with parseStatus FAILED.
      required: [status, elapsedMs]
    ApiScope:
      type: string
      description: >
        Permission carried by an API key (ADR-010, ADR-032 §10). Clients must
        tolerate unknown future values.
      enum: ["inboxes:write", "messages:read", "api-keys:manage"]
    ApiKey:
      type: object
      description: >
        API-key metadata. This schema **never** carries secret material — the
        credential itself exists only in the `key` field of a CreatedApiKey,
        returned exactly once (ADR-032 §4).
      properties:
        id: { type: string, format: uuid }
        publicId:
          type: string
          description: >
            Non-secret handle embedded in the credential. Safe to display, log
            and quote in a support ticket; grants nothing on its own.
        name:
          type: string
          description: Operator-chosen label, e.g. the CI system that holds it.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ApiScope" }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Absent when the key does not expire.
        revokedAt:
          type: string
          format: date-time
          description: Absent while the key is usable. A revoked key is retained, never deleted.
        lastUsedAt:
          type: string
          format: date-time
          description: >
            Approximate — refreshed at most once per coalescing interval
            (5 minutes) and may lag by that much after a burst (ADR-032 §7).
            Intended for "is this still in use?", never as an audit record.
        createdByApiKeyId:
          type: string
          format: uuid
          description: >
            The credential that minted this one. It may reference a credential
            this API does not expose: a workspace's first managed key is minted
            with the bootstrap credential, and `GET /v1/api-keys/{id}` answers
            `404` for that id. Treat it as an audit breadcrumb to correlate
            with the `testinbox.audit` log, not as a followable link.
      required: [id, publicId, scopes, createdAt]
    CreatedApiKey:
      type: object
      description: >
        The one and only response that ever contains a credential. The
        plaintext is not stored, so it cannot be shown again or recovered —
        there is no "show key" endpoint and there can be no "recover key"
        (ADR-032 §4). A lost key is replaced by minting a new one and revoking
        the old.
      properties:
        apiKey: { $ref: "#/components/schemas/ApiKey" }
        key:
          type: string
          description: >
            The full credential, e.g. `ti_k1_<publicId>_<secret>_<check>`.
            Present here and nowhere else, ever.
          examples: ["ti_k1_a3f7q2mzk4x9b6dt_REDACTED-SECRET-COMPONENT-NEVER-SHOWN-IN-DOCS_7h2q"]
      required: [apiKey, key]
    ApiKeyPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
        nextCursor:
          type: string
          description: Opaque cursor; absent when no further page exists.
      required: [items]
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Operator-chosen label. Not a secret and not unique.
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiScope" }
          description: >
            Least privilege — request only what the holder needs. A key cannot
            grant a scope the caller does not itself hold, so a CI key can
            never escalate. Immutable once created (ADR-032 §10).
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 60
          description: Optional lifetime. Omit for a key that does not expire.
      required: [scopes]
paths:
  /inboxes:
    post:
      operationId: createInbox
      summary: Create an inbox (GENERATED or EXACT addressing, ADR-021).
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInboxRequest" }
      responses:
        "201":
          description: >
            Inbox created — or, when `Idempotency-Replayed` is true, the inbox
            a previous identical request created. A replay reports the resource
            as it was at creation; it is a record of what the request did, not
            an assertion that the inbox still exists, so a replay followed by a
            fetch may yield `404` once the inbox has expired.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/correlationId" }
            Idempotency-Replayed: { $ref: "#/components/headers/idempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: >
            Either the EXACT local-part is already reserved or in cooldown
            (`type: https://testinbox.email/problems/address-already-reserved`,
            ADR-021), or a workspace quota is exhausted
            (`type: https://testinbox.email/problems/quota-exceeded`, ADR-027).
            Clients must discriminate on the problem `type`, never on the
            status code. Quota exhaustion carries no `Retry-After`: waiting
            does not help, the caller must free capacity.

            With an `Idempotency-Key`, two further types are possible:
            `idempotency-key-reused` (the key is bound to a different logical
            request — retrying with it can never succeed) and
            `idempotency-request-in-progress` (a concurrent identical request
            is still running — carries `Retry-After`, and retrying is correct).

            Neither an address conflict nor a quota refusal binds the key.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /inboxes/{id}:
    get:
      operationId: getInbox
      parameters:
        - $ref: "#/components/parameters/inboxId"
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteInbox
      summary: Explicit early teardown; cascades to messages/attachments via the lifecycle sweep.
      parameters:
        - $ref: "#/components/parameters/inboxId"
      responses:
        "204":
          description: Inbox marked deleted; data removal completes asynchronously but boundedly.
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /inboxes/{id}/messages:
    get:
      operationId: listMessages
      summary: Cursor-paginated message list, receipt order.
      parameters:
        - $ref: "#/components/parameters/inboxId"
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /inboxes/{id}/messages/wait:
    post:
      operationId: waitForMessage
      summary: >
        Deterministic long-poll wait (check → subscribe → recheck → park).
        Non-consuming; earliest matching message wins.
      parameters:
        - $ref: "#/components/parameters/inboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitRequest" }
      responses:
        "200":
          description: MATCHED with the message, or TIMEOUT with diagnostics (never 408 — ADR-020).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410":
          description: >
            Inbox is no longer ACTIVE
            (`type: https://testinbox.email/problems/inbox-gone`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: >
            Either the workspace's wait request rate was exceeded
            (`type: .../rate-limit-exceeded`) or it already holds every
            concurrent wait slot
            (`type: .../concurrent-wait-limit-exceeded`). Both are
            time-recoverable and carry `Retry-After`.
          headers:
            Retry-After: { $ref: "#/components/headers/retryAfter" }
            RateLimit-Limit: { $ref: "#/components/headers/rateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/rateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/rateLimitReset" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /messages/{id}:
    get:
      operationId: getMessage
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Parsed message (fields absent when parseStatus is FAILED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          description: Not found — also returned for cross-workspace ids (no existence leakage).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /messages/{id}/raw:
    get:
      operationId: getRawMime
      summary: Raw MIME bytes as accepted on the wire (ADR-005).
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Raw MIME.
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /messages/{id}/attachments:
    get:
      operationId: listAttachments
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Attachment metadata only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttachmentMeta" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /messages/{id}/attachments/{attachmentId}:
    get:
      operationId: getAttachment
      summary: >
        Attachment bytes, served as an opaque download
        (`Content-Disposition: attachment`, `nosniff`, restrictive CSP).
      parameters:
        - $ref: "#/components/parameters/messageId"
        - $ref: "#/components/parameters/attachmentId"
      responses:
        "200":
          description: Attachment bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api-keys:
    post:
      operationId: createApiKey
      summary: Mint a managed API key; the credential is returned exactly once.
      description: >
        Requires the `api-keys:manage` scope. The response is the only place
        the credential ever appears — it is not stored and cannot be shown
        again (ADR-032 §4). The new key belongs to the caller's own workspace
        and project, which are derived from the authenticated credential and
        can never be supplied by the client.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Key created; `key` carries the plaintext for the first and last time.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/correlationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
        "400":
          description: >
            `type: https://testinbox.email/problems/invalid-request` — an
            unknown or empty scope, a name over 100 characters, or an
            `expiresInSeconds` outside the supported range.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: >
            The caller lacks `api-keys:manage`
            (`type: https://testinbox.email/problems/missing-scope`), or asked
            for a scope it does not itself hold
            (`type: https://testinbox.email/problems/scope-escalation`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: >
            Only with an `Idempotency-Key`, and this endpoint **suppresses the
            duplicate rather than replaying the response** (ADR-033 §8).

            `type: https://testinbox.email/problems/idempotency-secret-not-replayable`
            — this exact request already created a credential. It is named by
            `apiKeyId` and `publicId` so it can be revoked without a list call,
            but its secret was returned once and cannot be re-issued: nothing
            in the system retains it (ADR-032 §4). Revoke it and mint again
            under a fresh key.

            A refusal rather than a `200` with the credential omitted, so a
            client cannot write an absent secret into its store and fail
            somewhere else later.

            Also possible: `idempotency-key-reused` and
            `idempotency-request-in-progress`, as for inbox creation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: listApiKeys
      summary: List the workspace's API keys, newest first. Never returns secret material.
      description: >
        Requires the `api-keys:manage` scope. Revoked keys are included — they
        are retained for audit — and are identified by a present `revokedAt`.
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: >
            Clamped, not validated: values below 1 or above 200 are adjusted to
            the nearest bound rather than refused, so a client need not encode
            the server's page-size policy.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: A page of key metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api-keys/{id}:
    get:
      operationId: getApiKey
      summary: Metadata for one key. Never returns the secret.
      description: >
        Requires the `api-keys:manage` scope. A **revoked** key is still
        returned — revocation is a state change, not a deletion — and is
        identified by a present `revokedAt`. "Delete then expect 404" is
        therefore the wrong check; read `revokedAt` instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Key metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          description: >
            No such key **in the caller's workspace**. A key belonging to
            another workspace is reported identically, so the endpoint cannot
            be used to probe for credentials elsewhere.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: revokeApiKey
      summary: Revoke a key. The row is retained; only its usability changes.
      description: >
        Requires the `api-keys:manage` scope. Revocation takes effect on the
        next request on every node — no authorization state is cached
        (ADR-032 §5). **Idempotent**: revoking an already-revoked key is `204`,
        so a client retrying after a network failure is never told its own
        successful call failed. Whether a key was already revoked is visible
        in its `revokedAt`.

        Revoking the last key holding `api-keys:manage` is permitted: refusing
        it would forbid revoking a compromised administrative credential. The
        break-glass path is the bootstrap credential, which reopens exactly
        when no usable managed admin key remains (ADR-032 §8).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The key is revoked and no longer authenticates.
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
