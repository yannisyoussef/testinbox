# The DEPLOYED layer for the REST API (ADR-028/029/034): everything staging
# and production have in common. It is never activated by name — the profile
# groups in application.yaml pull it in under `staging` and `production`, so
# the two environments cannot drift apart by editing one copy.
#
# The production overrides are the SECOND DOCUMENT of this file (below the
# `---`), activated on the `production` profile. They are here and not in an
# `application-production.yaml` for a precedence reason that is easy to get
# wrong: Spring expands `production` to `[production, deployed]` and the LATER
# profile wins, so a separate production file would be silently shadowed by
# this one. A later document in the same file wins over an earlier one
# regardless of group order. `DeployedProfileLayeringTest` loads the real
# files through Spring and proves the overrides take effect.
#
# Everything here is deliberately WITHOUT a default: an unset variable must
# fail startup, not silently fall back to the local-development value in
# application.yaml. That is the failure this profile exists to prevent —
# a deployed node quietly running on `testinbox/testinbox` against localhost.
# `DeploymentSafetyCheck` catches the rest (values that resolve but are the
# local defaults, plaintext public URLs, a proxy timeout shorter than the wait
# window, and in production the invariants ADR-034 fixes).
server:
  port: 8080
  # A parked long poll is a live request: drain it rather than cutting it.
  shutdown: graceful
  # The ingress terminates TLS and is the only thing that may talk to us.
  forward-headers-strategy: native
  tomcat:
    # Belt and braces behind nginx's own header limits (docs/dev/staging.md).
    max-http-form-post-size: 1MB

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TESTINBOX_DB_URL}
    username: ${TESTINBOX_DB_USER}
    password: ${TESTINBOX_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${TESTINBOX_DB_POOL_SIZE:16}
  # ADR-029: exactly one migration executor, and it is not this process.
  flyway:
    enabled: false
  lifecycle:
    # Must exceed testinbox.wait-window-cap or shutdown truncates a legitimate wait.
    timeout-per-shutdown-phase: ${TESTINBOX_SHUTDOWN_GRACE:75s}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

testinbox:
  mail-domain: ${TESTINBOX_MAIL_DOMAIN}
  wait-window-cap: ${TESTINBOX_WAIT_WINDOW_CAP:60s}
  # N, the closed beta's participant cap (docs/dev/beta-limits.md): 1..30, and
  # 30 when unset. It may only LOWER the cohort's thirty places; lowering it
  # evicts nobody, it only stops new admissions. The API admits to it and both
  # deployables compute the INGEST envelope r x (N + L) from it, so set it
  # identically on both. Under ALL an N the owner approved no envelope for is
  # refused at startup (IngestEnvelopeSafety).
  beta:
    max-participants: ${TESTINBOX_BETA_MAX_PARTICIPANTS:30}
  # The closed-beta INGEST envelope (ADR-035 amendment D, owner decision
  # 2026-11-06; docs/dev/beta-limits.md). INCOMING recipient copies, charged
  # per inbox first, then per workspace; TestInbox sends no mail. A copy over
  # budget is discarded with the uniform SMTP 250 and counted as
  # ingest_rate_limited, never queued. Shared by staging and production so
  # staging rehearses the production envelope. Under ALL, DeploymentSafety
  # refuses a burst above 60, a refill whose r x (N + L) exceeds
  # TESTINBOX_STORAGE_GATED_EXPECTED_RATE, and a per-inbox value above the
  # workspace's. The library defaults (300/10 and 60/2) stay for development.
  limits:
    ingest:
      capacity: ${TESTINBOX_LIMITS_INGEST_CAPACITY:60}
      refill-per-second: ${TESTINBOX_LIMITS_INGEST_REFILL_PER_SECOND:1.0}
    ingest-per-inbox:
      capacity: ${TESTINBOX_LIMITS_INGEST_PER_INBOX_CAPACITY:30}
      refill-per-second: ${TESTINBOX_LIMITS_INGEST_PER_INBOX_REFILL_PER_SECOND:0.5}
  events:
    # The event stream's visibility horizon (ADR-020 clarification of
    # 2026-10-20). Promised by the API contract, so DeploymentSafety refuses
    # any other value: not an environment knob, declared for visibility.
    visibility-lag: 90s
  storage:
    endpoint: ${TESTINBOX_S3_ENDPOINT}
    region: ${TESTINBOX_S3_REGION:us-east-1}
    access-key: ${TESTINBOX_S3_ACCESS_KEY}
    secret-key: ${TESTINBOX_S3_SECRET_KEY}
    bucket: ${TESTINBOX_S3_BUCKET:testinbox-mime}
    create-bucket: ${TESTINBOX_S3_CREATE_BUCKET:true}
    # ADR-035 §14 / TI-STORAGE-006: OFF | TENANT_LIMITS | ALL. The default, and
    # the only value any committed environment may carry, is OFF
    # (scripts/check-storage-enforcement-off.sh). A non-OFF value is refused at
    # startup unless every §18 declaration below is set and consistent (the
    # bucket quota and churn figure are OPTIONAL since ADR-035 Amendment 2), and
    # the declared backend matches a shipped qualification record (§9a).
    enforcement: ${TESTINBOX_STORAGE_ENFORCEMENT:OFF}
    global-limit-bytes: ${TESTINBOX_STORAGE_GLOBAL_LIMIT_BYTES:}
    declared-bucket-quota-bytes: ${TESTINBOX_STORAGE_DECLARED_BUCKET_QUOTA_BYTES:}
    declared-max-ingestion-processes: ${TESTINBOX_STORAGE_DECLARED_MAX_INGESTION_PROCESSES:}
    inbox-share: ${TESTINBOX_STORAGE_INBOX_SHARE:}
    measured-quota-lag-churn-bytes: ${TESTINBOX_STORAGE_MEASURED_QUOTA_LAG_CHURN_BYTES:}
    # ADR-035 amendment D: R_gated, the §11 expected rate (events/s) of the
    # passing gate D evidence, and L, the legacy-share workspaces beside the N
    # participant places. No defaults: ALL is refused while either is unset.
    gated-expected-rate: ${TESTINBOX_STORAGE_GATED_EXPECTED_RATE:}
    declared-legacy-workspaces: ${TESTINBOX_STORAGE_DECLARED_LEGACY_WORKSPACES:}
    activation:
      expected-api-nodes: ${TESTINBOX_STORAGE_EXPECTED_API_NODES:}
      expected-ingestion-nodes: ${TESTINBOX_STORAGE_EXPECTED_INGESTION_NODES:}
    # The dedicated filesystem's declared budgets (filesystem-containment
    # contract, TI-STORAGE-006E). Declarations, not proof: gate F verifies them.
    filesystem:
      block-size-bytes: ${TESTINBOX_STORAGE_FS_BLOCK_SIZE_BYTES:}
      object-overhead-max-bytes: ${TESTINBOX_STORAGE_FS_OBJECT_OVERHEAD_MAX_BYTES:}
      global-footprint-limit-bytes: ${TESTINBOX_STORAGE_FS_GLOBAL_FOOTPRINT_LIMIT_BYTES:}
      deletion-debt-budget-bytes: ${TESTINBOX_STORAGE_FS_DELETION_DEBT_BUDGET_BYTES:}
      metadata-budget-bytes: ${TESTINBOX_STORAGE_FS_METADATA_BUDGET_BYTES:}
      operational-reserve-bytes: ${TESTINBOX_STORAGE_FS_OPERATIONAL_RESERVE_BYTES:}
      capacity-bytes: ${TESTINBOX_STORAGE_FS_CAPACITY_BYTES:}
      inodes: ${TESTINBOX_STORAGE_FS_INODES:}
      observation-max-age: ${TESTINBOX_STORAGE_FS_OBSERVATION_MAX_AGE:}
      probe-budget-bytes: ${TESTINBOX_STORAGE_FS_PROBE_BUDGET_BYTES:}
      monitor-role: ${TESTINBOX_STORAGE_FS_MONITOR_ROLE:}
      retention-pacing-max-delay: ${TESTINBOX_STORAGE_FS_RETENTION_PACING_MAX_DELAY:}
    # Issue #102: a qualification record read from a FILE, for the isolated
    # lab only. Refused at startup unless TESTINBOX_ENVIRONMENT is exactly
    # "lab" (staging and production never set it), and never enablement
    # evidence: it lets the lab run the current upload implementation under
    # an enforcing mode before a record qualified on it exists.
    qualification:
      lab-record-path: ${TESTINBOX_STORAGE_QUALIFICATION_LAB_RECORD_PATH:}
  bootstrap:
    # The dedicated synthetic-test credential (docs/dev/staging.md). Injected
    # from the environment's secret store; only its SHA-256 is ever persisted.
    api-key: ${TESTINBOX_BOOTSTRAP_API_KEY:}
  deployment:
    environment: ${TESTINBOX_ENVIRONMENT}
    public-base-url: ${TESTINBOX_PUBLIC_BASE_URL}
    # Declared, not probed: the point is to refuse a deployment whose ingress
    # would abort a legitimate long poll (ADR-020, docs/dev/staging.md).
    proxy-read-timeout: ${TESTINBOX_PROXY_READ_TIMEOUT}
    # Hard ceiling the environment's ingress imposes on ANY request. Cloudflare
    # caps at ~100s on the deployed staging path (ADR-030) and no application
    # setting raises it, so the wait window must fit underneath. Unset where the
    # ingress is ours and imposes no ceiling of its own.
    edge-request-ceiling: ${TESTINBOX_EDGE_REQUEST_CEILING:}
    git-sha: ${TESTINBOX_GIT_SHA:unknown}
    image-digest: ${TESTINBOX_IMAGE_DIGEST:unknown}

management:
  # Actuator moves off the traffic port entirely, so the public listener
  # exposes nothing but /v1 (docs/dev/staging.md §network boundaries).
  server:
    port: ${TESTINBOX_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Reachable only on the private management port.
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # "Can this instance correctly serve TestInbox traffic?" — the
          # database, a schema it recognises, object storage, the
          # session-scoped LISTEN connection ADR-020 puts in readiness, and
          # whether the database bounds a hung idempotency claim (ADR-033;
          # reported everywhere, enforced only where the profile says so), and
          # the V22 account-lifecycle relations its role must be able to read.
          include: readinessState,db,schema,objectStorage,waitNotifier,dbSession,lifecyclePrivileges
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: false
    os:
      enabled: false
    process:
      enabled: false
  metrics:
    tags:
      # Low-cardinality deployment correlation only (observability.md).
      service: testinbox-api
      environment: ${TESTINBOX_ENVIRONMENT}

info:
  testinbox:
    environment: ${TESTINBOX_ENVIRONMENT}
    gitSha: ${TESTINBOX_GIT_SHA:unknown}
    imageDigest: ${TESTINBOX_IMAGE_DIGEST:unknown}

---
# Production overrides (ADR-034 §4) — only what is stricter than the shared
# layer above. A document can still be overridden by an environment variable,
# so this is the default and `DeploymentSafety` is the enforcement: a
# production process whose effective values contradict these refuses to
# start, whichever source they came from.
spring:
  config:
    activate:
      on-profile: production

testinbox:
  # The tenant domain the public MX will name (ADR-004). Fixed, not injected.
  mail-domain: inbox.testinbox.email
  storage:
    # Runtime credentials are scoped to the pre-provisioned bucket and hold no
    # CreateBucket. An absent bucket is a readiness failure, never a silent
    # creation under broader privileges.
    create-bucket: false
  deployment:
    # ADR-033: a hung idempotency claim must be bounded by the database.
    # Reported in every deployed environment; here it takes the node out of
    # readiness until Ops sets `idle_in_transaction_session_timeout`.
    # (The ingress ceiling is NOT redeclared here: the shared layer's optional
    # form resolves an unset variable to null, and DeploymentSafety refuses a
    # production node without one — in the same aggregated report as every
    # other violation, rather than a bare placeholder exception.)
    require-database-session-timeout: true
