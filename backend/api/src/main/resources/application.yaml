server:
  port: 8080

spring:
  application:
    name: testinbox-api
  profiles:
    # One deployed layer, two environments (ADR-034). `staging` and
    # `production` each pull in `deployed`; production then adds its own
    # fail-closed document on top. Activating `deployed` directly is not a
    # supported configuration — DeploymentSafety refuses a process whose
    # declared environment and active profile disagree.
    group:
      staging: deployed
      production: deployed
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TESTINBOX_DB_URL:jdbc:postgresql://localhost:5432/testinbox}
    username: ${TESTINBOX_DB_USER:testinbox}
    password: ${TESTINBOX_DB_PASSWORD:testinbox}
    hikari:
      data-source-properties:
        # ADR-035 §14 (a): testinbox-<service>:<node>:storage-v1, the capability allowlist.
        ApplicationName: testinbox-api:${testinbox.storage.node-id}:storage-v1
  flyway:
    enabled: true

testinbox:
  accounts:
    enabled: ${TESTINBOX_ACCOUNTS_ENABLED:false}
    public-origin: ${TESTINBOX_ACCOUNTS_PUBLIC_ORIGIN:}
    # Optional. Shared ONLY with the website's /account proxy, which may then
    # name the client address for the sign-in source budget. Unset: every
    # sign-in shares the proxy peer's budget (fail-safe). A set value shorter
    # than 32 bytes or obviously weak refuses startup. Never logged.
    client-address-secret: ${TESTINBOX_ACCOUNTS_CLIENT_ADDRESS_SECRET:}
    waitlist:
      retention: ${TESTINBOX_ACCOUNTS_WAITLIST_RETENTION:30d}
      maximum: ${TESTINBOX_ACCOUNTS_WAITLIST_MAXIMUM:1000}
    oauth:
      state-key-base64: ${TESTINBOX_ACCOUNTS_OAUTH_STATE_KEY_BASE64:}
      google:
        enabled: ${TESTINBOX_ACCOUNTS_OAUTH_GOOGLE_ENABLED:false}
        client-id: ${TESTINBOX_ACCOUNTS_OAUTH_GOOGLE_CLIENT_ID:}
        client-secret: ${TESTINBOX_ACCOUNTS_OAUTH_GOOGLE_CLIENT_SECRET:}
      github:
        enabled: ${TESTINBOX_ACCOUNTS_OAUTH_GITHUB_ENABLED:false}
        client-id: ${TESTINBOX_ACCOUNTS_OAUTH_GITHUB_CLIENT_ID:}
        client-secret: ${TESTINBOX_ACCOUNTS_OAUTH_GITHUB_CLIENT_SECRET:}
    email:
      enabled: ${TESTINBOX_ACCOUNTS_EMAIL_ENABLED:false}
      verification-key-base64: ${TESTINBOX_ACCOUNTS_EMAIL_VERIFICATION_KEY_BASE64:}
      smtp:
        host: ${TESTINBOX_ACCOUNTS_EMAIL_SMTP_HOST:}
        port: ${TESTINBOX_ACCOUNTS_EMAIL_SMTP_PORT:587}
        username: ${TESTINBOX_ACCOUNTS_EMAIL_SMTP_USERNAME:}
        password: ${TESTINBOX_ACCOUNTS_EMAIL_SMTP_PASSWORD:}
        from: ${TESTINBOX_ACCOUNTS_EMAIL_SMTP_FROM:}
  mail-domain: ${TESTINBOX_MAIL_DOMAIN:testinbox.local}
  default-ttl: 15m
  max-ttl: 24h
  expiry-grace: 30s
  exact-cooldown: 24h
  wait-window-cap: 60s
  events:
    visibility-lag: 90s
  sweep-interval: 5s
  orphan-sweep-interval: 30m
  orphan-min-age: 1h
  storage:
    # ADR-035 §9: stable across restarts; persisted ambiguity is counted per node.
    node-id: ${TESTINBOX_STORAGE_NODE_ID:testinbox-api}
    endpoint: ${TESTINBOX_S3_ENDPOINT:http://localhost:9000}
    access-key: ${TESTINBOX_S3_ACCESS_KEY:testinbox}
    secret-key: ${TESTINBOX_S3_SECRET_KEY:testinbox123}
    bucket: testinbox-mime
  bootstrap:
    api-key: ${TESTINBOX_BOOTSTRAP_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Token exchanges and mail protocols must not emit secrets at debug level.
logging:
  level:
    org.springframework.web.client: WARN
    org.springframework.security.oauth2: WARN
