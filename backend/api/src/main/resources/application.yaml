server:
  port: 8080

spring:
  application:
    name: testinbox-api
  profiles:
    # One deployed layer, two environments (ADR-034). `staging` and
    # `production` each pull in `deployed`; production then adds its own
    # fail-closed document on top. Activating `deployed` directly is not a
    # supported configuration — DeploymentSafety refuses a process whose
    # declared environment and active profile disagree.
    group:
      staging: deployed
      production: deployed
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TESTINBOX_DB_URL:jdbc:postgresql://localhost:5432/testinbox}
    username: ${TESTINBOX_DB_USER:testinbox}
    password: ${TESTINBOX_DB_PASSWORD:testinbox}
    hikari:
      data-source-properties:
        # ADR-035 §14 (a): testinbox-<service>:<node>:storage-v1, the capability allowlist.
        ApplicationName: testinbox-api:${testinbox.storage.node-id}:storage-v1
  flyway:
    enabled: true

testinbox:
  mail-domain: ${TESTINBOX_MAIL_DOMAIN:testinbox.local}
  default-ttl: 15m
  max-ttl: 24h
  expiry-grace: 30s
  exact-cooldown: 24h
  wait-window-cap: 60s
  sweep-interval: 5s
  orphan-sweep-interval: 30m
  orphan-min-age: 1h
  storage:
    # ADR-035 §9: stable across restarts; persisted ambiguity is counted per node.
    node-id: ${TESTINBOX_STORAGE_NODE_ID:testinbox-api}
    endpoint: ${TESTINBOX_S3_ENDPOINT:http://localhost:9000}
    access-key: ${TESTINBOX_S3_ACCESS_KEY:testinbox}
    secret-key: ${TESTINBOX_S3_SECRET_KEY:testinbox123}
    bucket: testinbox-mime
  bootstrap:
    api-key: ${TESTINBOX_BOOTSTRAP_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
