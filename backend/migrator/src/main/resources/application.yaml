spring:
  application:
    name: testinbox-migrator
  main:
    web-application-type: none
    banner-mode: "off"
  datasource:
    url: ${TESTINBOX_DB_URL:jdbc:postgresql://localhost:5432/testinbox}
    username: ${TESTINBOX_DB_USER:testinbox}
    password: ${TESTINBOX_DB_PASSWORD:testinbox}
    hikari:
      # One short-lived connection is all a one-shot job needs.
      maximum-pool-size: 2
  flyway:
    enabled: true
    # An existing database created before Flyway was introduced would otherwise
    # need manual intervention; a fresh one is unaffected.
    baseline-on-migrate: false

logging:
  level:
    root: INFO
    org.flywaydb: INFO
